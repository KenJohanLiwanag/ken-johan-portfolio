<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Primary SEO -->
    <title>Ken Johan Liwanag | Software Developer Portfolio</title>
    <meta
      name="description"
      content="Portfolio of Ken Johan Liwanag, a Computer Science student and software developer from the Philippines. Projects, certifications, skills, and contact info."
    />
    <meta name="author" content="Ken Johan Liwanag" />
    <meta name="theme-color" content="#0b0b12" />

    <!-- Pick the theme before the first paint so the page never flashes the
         wrong colours: saved choice first, else the device's light/dark setting. -->
    <script>
      ;(function () {
        var theme
        try {
          theme = localStorage.getItem('theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = theme
        if (theme === 'light') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6f5fb')
        }
      })()
    </script>
    <link rel="canonical" href="https://ken-johan-portfolio.vercel.app/" />

    <!-- Open Graph (Facebook, LinkedIn, Discord, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ken Johan Liwanag" />
    <meta property="og:title" content="Ken Johan Liwanag | Software Developer Portfolio" />
    <meta
      property="og:description"
      content="Computer Science student and software developer from the Philippines. See my projects and certifications, and get in touch."
